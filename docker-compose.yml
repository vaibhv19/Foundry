version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: foundry_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: foundry
      POSTGRES_USER: foundry_user
      POSTGRES_PASSWORD: foundry_pass
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foundry_user -d foundry"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: foundry_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  db_data:
  redis_data:
